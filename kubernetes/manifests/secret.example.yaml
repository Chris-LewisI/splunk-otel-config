# Template only - do not commit a filled-in copy of this file.
#
# Lets you keep tokens out of the Helm values. Create this secret first, then set
# in your values file:
#
#   secret:
#     create: false
#     name: splunk-otel-collector-tokens
#
# Key names are fixed by the chart and must match exactly.
#
# Create it imperatively instead of committing values:
#
#   kubectl create secret generic splunk-otel-collector-tokens \
#     -n splunk-otel \
#     --from-literal=splunk_observability_access_token='<o11y-access-token>' \
#     --from-literal=splunk_platform_hec_token='<hec-token>'
#
# In a real cluster prefer External Secrets Operator or AWS Secrets Manager via
# Pod Identity over a static manifest.

apiVersion: v1
kind: Secret
metadata:
  name: splunk-otel-collector-tokens
  namespace: splunk-otel
type: Opaque
stringData:
  # Splunk Observability Cloud org access token (metrics, traces, events).
  splunk_observability_access_token: CHANGEME
  # Splunk Platform HEC token. Only needed if sending logs to Splunk Enterprise/Cloud.
  splunk_platform_hec_token: CHANGEME
